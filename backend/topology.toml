# Home energy topology. Generated from `python tools/discover.py` (see tools/discovery_output.json)
# and reconciled with the owner's device table in docs/GOAL.md.
#
# zone     : "ground" | "first" | "garden" — how the dashboard groups things.
# kind     : "inverter" (Felicity deviceType OG) | "battery" (deviceType BP).
# zones    : zones a device serves. Energy flows come from inverters only, so a battery shared
#            by several zones is never double-counted; batteries supply SoC/SoH/cell data.
# tz       : the device clock's UTC offset; the cloud reports sample times in this local clock.

[[plant]]
id = "11160008309715425"
name = "grand floor"
zone = "ground"
label = "Ground Floor"

[[plant]]
id = "11160032281678305"
name = "first floor"
zone = "first"
label = "First Floor"

[[plant]]
id = "11728964549835233"
name = "Garden"
zone = "garden"
label = "Garden"

[[device]]
sn = "020308004825320226"
kind = "inverter"
model = "IVEM8048"
plant = "11160008309715425"
